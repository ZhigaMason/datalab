version: "3.9"
services:
  ingestion:
    build: ./ingestion
    volumes:
      - ./data:/data
  prediction:
    build: ./prediction
    depends_on:
      - ingestion
    volumes:
      - ./data:/data
  dashboard:
    build: ./dashboard
    ports:
      - "8050:8050"
    depends_on:
      - prediction
