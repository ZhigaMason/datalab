[project]
name = "w2v"
version = "0.1.0"
description = "Word2vec variants: bidirectional/causal x negative-sampling/JEPA"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "onnx>=1.17",
    "onnxscript>=0.3",
    "onnxruntime>=1.20",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
prep = [
    "ufal.udpipe>=1.3",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["w2v"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
